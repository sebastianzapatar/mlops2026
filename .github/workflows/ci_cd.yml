name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Pruebas y Calidad de Código
  # ──────────────────────────────────────────────
  test:
    name: "🧪 Tests & Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # uv lee la versión de .python-version (3.12) y la descarga si no existe.
      # --locked falla si uv.lock no coincide con pyproject.toml.
      # Sin el grupo eda: CI no necesita Jupyter ni matplotlib.
      - name: Instalar dependencias
        run: uv sync --locked --no-group eda

      - name: Lint con flake8
        run: uv run flake8 *.py tests/ --max-line-length=120

      - name: Entrenar modelo para tests
        run: uv run python train.py

      - name: Ejecutar tests
        run: uv run pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # JOB 2: Deploy GitHub Pages (presentaciones)
  # ──────────────────────────────────────────────
  deploy-pages:
    name: "🌐 Deploy Presentaciones"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefactos de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
