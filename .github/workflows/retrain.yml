# ──────────────────────────────────────────────
# Workflow de Reentrenamiento Programado
# Se ejecuta cada lunes a las 6:00 AM UTC
# ──────────────────────────────────────────────
name: "🔄 Reentrenamiento Automático"

on:
  schedule:
    - cron: "0 6 * * 1"  # Cada lunes a las 6 AM UTC
  workflow_dispatch:

jobs:
  retrain:
    name: "Reentrenar Modelo"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked --no-default-groups

      - name: Ejecutar reentrenamiento
        run: uv run python retrain.py

      # El modelo está excluido de Git: el resultado se entrega como artefacto
      # para revisión y despliegue explícito; este job no actualiza la API.
      - name: Guardar resultado del reentrenamiento
        uses: actions/upload-artifact@v4
        with:
          name: retrained-model
          path: |
            best_model.pkl
            model_metrics.json
            feature_store/
